<title id="title">MLS Partnership Tracker: research design</title>
<desc id="desc">Planned workflow: source major club partnerships, organize a versioned dataset, and study public attention. Current foundation: a club reference list and a Python/DuckDB data-test runner. Pipeline not live; no research findings shown.</desc>
